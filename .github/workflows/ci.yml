name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  node:
    runs-on: boat
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Use pinned npm on the disposable runner
        run: npm install --global npm@11.12.0
      - run: npm ci
      - name: Prettier check
        run: npx prettier --check .
      - name: ESLint check
        run: npx eslint .
      - name: Typecheck modules and tests
        run: npm run typecheck
      - name: Run component tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Copy 404 page
        run: cp public/404.html dist/404.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: node
    runs-on: boat
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
